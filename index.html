<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SIRB | Digital Business Card</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #F4F3F8;

  font-family: Arial, sans-serif;

  padding: 20px;

}

.card {

  width: 100%;

  max-width: 390px;

  background: white;

  color: #30304A;

  padding: 30px 25px;

  border-radius: 24px;

  text-align: center;

  box-shadow: 0 15px 40px #3C53A422;

  border-top: 7px solid #3C53A4;

}

.logo {

  width: 145px;

  height: 105px;

  object-fit: contain;

  display: block;

  margin: 0 auto 12px;

}

.eng {

  color: #7652A1;

  letter-spacing: 3px;

  font-size: 12px;

  font-weight: bold;

}

.line {

  height: 1px;

  background: #E5E1EE;

  margin: 25px 0;

}

h2 {

  font-size: 24px;

  margin: 10px;

  color: #3C53A4;

  direction: ltr;

}

p {

  color: #7652A1;

  line-height: 1.8;

}

.role {

  font-size: 15px;

}

a {

  display: block;

  background: #3C53A4;

  color: white;

  padding: 15px;

  margin: 12px 0;

  border-radius: 12px;

  text-decoration: none;

  font-weight: bold;

}

a:nth-of-type(even) {

  background: #7652A1;

}

.footer {

  font-size: 11px;

  color: #7652A1;

  margin-top: 25px;

  letter-spacing: 2px;

}

</style>

</head>

<body>

<div class="card">

<img src="logo.png" class="logo" alt="SIRB Logo">

<div class="eng">EXPERIENCE SOLUTIONS</div>

<div class="line"></div>

<h2>Munirah Alhaddad</h2>

<p class="role">CEO</p>

<div class="line"></div>

<a href="#">WhatsApp</a>

<a href="#">Email</a>

<a href="#">انضم كمنظم</a>

<div class="footer">

SIRB EXPERIENCE SOLUTIONS

</div>

</div>

</body>

</html>
