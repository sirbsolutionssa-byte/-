<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>سِرب | بطاقة رقمية</title>

<style>

body{

display:flex;align-items:center;justify-content:center;

background:#eeeae3;font-family:Arial,sans-serif;

padding:20px;

}

.card{

width:100%;max-width:390px;

background:#263d36;color:white;

padding:40px 25px;border-radius:24px;

text-align:center;

box-shadow:0 15px 40px #0002;

}

.logo{font-size:38px;letter-spacing:9px;font-weight:bold}

.eng{color:#d6c5a1;letter-spacing:3px;font-size:12px}

.line{height:1px;background:#65776e;margin:28px 0}

h2{font-size:25px;margin:10px}

p{color:#d6dcd8;line-height:1.8}

a{

display:block;background:#d6c5a1;color:#263d36;

padding:14px;margin:12px 0;

border-radius:10px;text-decoration:none;font-weight:bold;

}

.footer{font-size:11px;color:#b9c5bd;margin-top:25px}

</style>

</head>

<body>

<div class="card">

<div class="logo">سِرب</div>

<div class="eng">SIRB</div>

<p>EXPERIENCE SOLUTIONS</p>

<h2>اسم الموظف</h2>

<div class="line"></div>

<a href="#">تواصل معنا</a>

<a href="#">واتساب</a>

<a href="#">البريد الإلكتروني</a>

</html>
